# Dataset configuration for local G1 teleoperation smoke finetuning.
#
# This expects DATA_DIR to point at the local A1 data directory that contains
# `g1_episode_0013_lerobot/`.

image_augmentation:
  enable: false
  enable_random_erasing: false
  enable_sharpening: false
  augmentation_prob: 0.0

lerobot:
  - path: ${oc.env:DATA_DIR}/g1_episode_0013_lerobot
    weight: 1.0
    normalization_type: bounds
    num_episodes: 1
    image_augmentation: false
