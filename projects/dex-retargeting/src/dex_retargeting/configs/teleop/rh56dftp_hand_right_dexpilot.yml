retargeting:
  type: DexPilot
  urdf_path: rh56dftp_hand/rh56dftp_right.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'right_little_1_joint', 'right_ring_1_joint', 'right_middle_1_joint', 'right_index_1_joint',
                        'right_thumb_2_joint', 'right_thumb_1_joint' ]
  wrist_link_name: "base"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip", "ring_tip", "pinky_tip" ]
  scaling_factor: 1.15

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 1.0
